  svgNode('rect',{x:panel.x,y:panel.y,width:panel.w,height:panel.h},svgNode('clipPath',{id:'indiaCrop'},defs));
  const shapes=svgNode('g',{'clip-path':'url(#indiaCrop)'},svg);
  const longitudeScale=Math.cos((mapBounds.north+mapBounds.south)/2*Math.PI/180),totalW=(mapBounds.east-mapBounds.west)*longitudeScale,totalH=mapBounds.north-mapBounds.south;
  const scale=Math.min(panel.w/totalW,panel.h/totalH),left=panel.x+(panel.w-totalW*scale)/2,top=panel.y+(panel.h-totalH*scale)/2;
  const pt=([lon,lat])=>[left+(lon-mapBounds.west)*longitudeScale*scale,top+(mapBounds.north-lat)*scale];
  const path=g=>allRings(g).map(ring=>ring.length<3?'':ring.map((coord,k)=>{const [x,y]=pt(coord);return `${k?'L':'M'}${x.toFixed(2)},${y.toFixed(2)}`;}).join(' ')+' Z').join(' ');
  let shadedCount=0;
  feats.forEach((f,i)=>{
    const [w,s,e,n]=bounds[i];if(e<mapBounds.west||w>mapBounds.east||n<mapBounds.south||s>mapBounds.north)return;
    const shaded=isShaded(i);if(shaded)shadedCount++;
    const label=districtName(f)+(featureStates[i]?' · '+featureStates[i]:'');
    const p=svgNode('path',{d:path(f.geometry),fill:mapSettings.colors[shaded?'shaded':'rest'],'fill-rule':'evenodd',stroke:'#8c9aa9','stroke-width':.6,'data-district':districtName(f),'data-state':featureStates[i],'data-shaded':String(shaded)},shapes);
    svgNode('title',{},p,label);
    if(editMode){p.setAttribute('role','button');p.setAttribute('tabindex','0');p.setAttribute('aria-label',label);p.setAttribute('aria-pressed',String(shaded));}
    p.onclick=()=>toggleDistrict(i);
    p.onkeydown=e=>{if(editMode&&(e.key==='Enter'||e.key===' ')){e.preventDefault();toggleDistrict(i);}};
    p.onmouseenter=()=>{document.getElementById('hoverDistrict').textContent=label;};
    p.onmouseleave=()=>{document.getElementById('hoverDistrict').textContent='';};
    p.onfocus=p.onmouseenter;p.onblur=p.onmouseleave;
  });
  if(current===4){
    const outlines=svgNode('g',{'clip-path':'url(#indiaCrop)','pointer-events':'none','aria-hidden':'true'},svg);
    const drawBoundary=(geometries,label)=>{
      const d=zoneBoundaryEdges(geometries).map(([a,b])=>{const [x1,y1]=pt(a),[x2,y2]=pt(b);return `M${x1.toFixed(2)},${y1.toFixed(2)}L${x2.toFixed(2)},${y2.toFixed(2)}`;}).join(' ');
      if(d)svgNode('path',{d,fill:'none',stroke:'#142b46','stroke-width':1.8,'stroke-linecap':'round','stroke-linejoin':'round','data-zone-boundary':label},outlines);
    };
    for(let zone=0;zone<4;zone++)drawBoundary(feats.filter((f,i)=>zoneShaded(i,zone)&&isShaded(i,4)).map(f=>f.geometry),keys[zone]);
    drawBoundary(feats.filter((f,i)=>isShaded(i,4)&&hitSets.every((_,zone)=>!zoneShaded(i,zone))).map(f=>f.geometry),'Manual');
  }
  const rows=current===4?entries.flat():entries[current],pending=rows.filter(r=>r.index===null);
  document.getElementById('zoneTitle').textContent=keys[current];
  document.getElementById('summary').textContent=`${rows.length-pending.length}/${rows.length} entries · ${pending.length} to review`;
  document.getElementById('reviewButton').textContent='Review'+(pending.length?' · '+pending.length:'');
  if(reviewOpen)renderReview(rows,pending);
  document.getElementById('status').textContent=shadedCount+' shaded'+(editMode?' · Click to toggle':'');
  document.getElementById('hoverDistrict').textContent='';
}
function reviewSelect(row){
  const select=document.createElement('select');select.setAttribute('aria-label',keys[row.zone]+' district for '+row.raw);select.disabled=busy;
  const empty=document.createElement('option');empty.value='';empty.textContent=row.index===null?'Choose district…':'Use lookup assignment';select.append(empty);
  const allowed=feats.flatMap((f,i)=>zoneStates[row.zone].some(s=>stateKey(s)===stateKey(featureStates[i]))?[i]:[]).sort((a,b)=>districtName(feats[a]).localeCompare(districtName(feats[b]))||featureStates[a].localeCompare(featureStates[b]));
  const groups=[['Suggested districts',row.suggested],['Other districts in this zone',allowed.filter(i=>!row.suggested.includes(i))]];
  for(const [label,indices] of groups){if(!indices.length)continue;const group=document.createElement('optgroup');group.label=label;for(const i of indices){const o=document.createElement('option');o.value=String(i);o.textContent=districtName(feats[i])+' · '+featureStates[i];group.append(o);}select.append(group);}
  if(row.method==='User review')select.value=String(row.index);
  select.onchange=()=>setChoice(row.zone,row.raw,select.value);return select;
}
function sourceLinks(row,parent){
  const urls=[...new Set(row.candidates.map(c=>c.source).filter(s=>/^https:\/\//.test(s)))];
  const line=document.createElement('div');line.className='small sources';
  urls.slice(0,3).forEach((url,i)=>{const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.textContent='Source '+(i+1);line.append(a,' ');});
  if(urls.length>3)line.append('Additional sources in CSV');parent.append(line);
}
function renderReview(rows,pending){
  const review=document.getElementById('unmatched');review.replaceChildren();
  if(!pending.length){const p=document.createElement('p');p.textContent='Nothing to review.';review.append(p);}
  for(const row of pending){const div=document.createElement('div');div.className='review-row';const label=document.createElement('b');label.textContent=(current===4?keys[row.zone]+' · ':'')+row.raw;div.append(label);div.append(reviewSelect(row));review.append(div);}
  const assigned=document.getElementById('assigned');assigned.replaceChildren();
  const summary=document.createElement('summary');summary.textContent='Assigned · '+(rows.length-pending.length);assigned.append(summary);
  for(const row of rows.filter(r=>r.index!==null)){const div=document.createElement('div');div.className='assigned-row';const label=document.createElement('div');label.textContent=(current===4?keys[row.zone]+' · ':'')+row.raw+' → '+districtName(feats[row.index])+' · '+featureStates[row.index];div.append(label);const p=document.createElement('p');p.className='small';p.textContent=row.method;div.append(p);sourceLinks(row,div);const edit=document.createElement('details'),caption=document.createElement('summary');caption.textContent='Change';edit.append(caption,reviewSelect(row));div.append(edit);assigned.append(div);}
}
function validGeoJSON(result){if(result?.type!=='FeatureCollection'||!Array.isArray(result.features)||result.features.length<500||result.features.some(f=>!districtName(f)||!['Polygon','MultiPolygon'].includes(f.geometry?.type)))throw Error('Choose an India ADM2 FeatureCollection with 500+ named district polygons.');return result.features;}
async function fetchJSON(url){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);try{const response=await fetch(url,{signal:controller.signal});if(!response.ok)throw Error('HTTP '+response.status);return await response.json();}finally{clearTimeout(timer);}}
async function load(){
  buildTabs();render();const version=++loadVersion,status=document.getElementById('status');status.textContent='Loading…';
  const links=[];
  if(location.protocol!=='file:')links.push(['geoBoundaries-IND-ADM2_simplified.geojson','Adjacent GeoJSON']);
  links.push(['https://raw.githubusercontent.com/wmgeolab/geoBoundaries/9469f09/releaseData/gbOpen/IND/ADM2/geoBoundaries-IND-ADM2_simplified.geojson','geoBoundaries download']);
  for(const [url,label] of links){if(version!==loadVersion)return;try{const result=await fetchJSON(url);if(version!==loadVersion)return;feats=validGeoJSON(result);boundarySource=label;prepare();return;}catch(e){console.warn('Boundary load failed:',url,e.message);}}
  if(version===loadVersion)status.textContent='More → Boundary file to load the map';
}
async function loadLocalGeoJSON(event){
  if(busy)return;const file=event.target.files?.[0];if(!file)return;const version=++loadVersion;
  try{const result=JSON.parse(await file.text());if(version!==loadVersion)return;const next=validGeoJSON(result);feats=next;boundarySource=file.name;prepare();}
  catch(e){document.getElementById('status').textContent='GeoJSON loading error: '+e.message;}
}
function svgBlob(){
  const svg=document.getElementById('map').cloneNode(true);
  svg.querySelectorAll('text,title,desc,foreignObject').forEach(node=>node.remove());
  svg.removeAttribute('class');svg.removeAttribute('role');svg.removeAttribute('aria-label');
  svg.querySelectorAll('path').forEach(node=>{for(const attr of ['role','tabindex','aria-label','aria-pressed'])node.removeAttribute(attr);});
  return new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml;charset=utf-8'});
}
async function pngBlob(){const obj=URL.createObjectURL(svgBlob());try{const img=new Image();await new Promise((ok,err)=>{img.onload=ok;img.onerror=()=>err(Error('Could not render map image'));img.src=obj;});const cv=document.createElement('canvas');cv.width=2400;cv.height=1680;cv.getContext('2d').drawImage(img,0,0,2400,1680);return await new Promise((ok,err)=>cv.toBlob(b=>b?ok(b):err(Error('PNG export failed')),'image/png'));}finally{URL.revokeObjectURL(obj);}}
function download(blob,name){const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function setBusy(value){busy=value;document.querySelectorAll('button,input,select').forEach(el=>el.disabled=value);}
async function exportTask(task){if(!dataReady||busy)return;setBusy(true);document.getElementById('status').textContent='Preparing export…';try{await task();render();}catch(e){document.getElementById('status').textContent='Export failed: '+e.message;}finally{setBusy(false);}}
async function savePNG(){return exportTask(async()=>download(await pngBlob(),keys[current].toLowerCase().replace(/ /g,'_')+'.png'));}
async function getAll(){const old=current,out=[];try{for(let i=0;i<5;i++){current=i;render();out.push(await pngBlob());}return out;}finally{current=old;render();}}
async function saveZIP(){return exportTask(async()=>{if(typeof JSZip==='undefined')throw Error('ZIP library unavailable. Connect to the internet and reload, or export each PNG.');const zip=new JSZip(),imgs=await getAll();imgs.forEach((b,i)=>zip.file(keys[i].toLowerCase().replace(/ /g,'_')+'.png',b));download(await zip.generateAsync({type:'blob'}),'district_maps_5_pngs.zip');});}
async function savePDF(){return exportTask(async()=>{if(!window.jspdf?.jsPDF)throw Error('PDF library unavailable. Connect to the internet and reload, or export each PNG.');const imgs=await getAll(),pdf=new jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});for(let i=0;i<5;i++){if(i)pdf.addPage();const data=await new Promise((ok,err)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>err(Error('Could not read PNG'));r.readAsDataURL(imgs[i]);});pdf.addImage(data,'PNG',0,0,297,207.9);}pdf.save('north_district_maps_5_pages.pdf');});}
function csvText(){const rows=[['zone','entry','status','boundary_district','state','method','candidate_districts','sources']];for(const row of entries.flat())rows.push([keys[row.zone],row.raw,row.index===null?'needs_review':'matched',row.index===null?'':districtName(feats[row.index]),row.index===null?'':featureStates[row.index],row.method,row.suggested.map(i=>districtName(feats[i])+' ('+featureStates[i]+')').join(' | '),[...new Set(row.candidates.map(c=>c.source))].join(' | ')]);return '\uFEFF'+rows.map(row=>row.map(value=>'"'+String(value).replace(/"/g,'""')+'"').join(',')).join('\r\n');}
function saveCSV(){if(dataReady&&!busy)download(new Blob([csvText()],{type:'text/csv;charset=utf-8'}),'india_district_lookup.csv');}
function saveChoices(){if(!busy)download(new Blob([JSON.stringify({version:2,choices:manual,mapSettings},null,2)],{type:'application/json'}),'india_district_map_settings.json');}
async function importChoices(event){
  if(busy)return;const file=event.target.files?.[0];if(!file)return;
  try{const data=JSON.parse(await file.text());if(![1,2].includes(data.version)||!data.choices||Array.isArray(data.choices)||typeof data.choices!=='object')throw Error('Choose a settings JSON saved from this page.');const clean={};for(let z=0;z<4;z++)for(const raw of groups[keys[z]]){const key=choiceKey(z,raw),r=data.choices[key];if(r&&typeof r.district==='string'&&typeof r.state==='string'&&zoneStates[z].some(s=>stateKey(s)===stateKey(r.state)))clean[key]={district:r.district,state:r.state,shapeID:typeof r.shapeID==='string'?r.shapeID:''};}manual={...manual,...clean};if(data.version===2){mapSettings=cleanMapSettings(data.mapSettings);persistMapSettings();}if(dataReady)prepare(false);else render();persist();}catch(e){document.getElementById('status').textContent='Settings import failed: '+e.message;}finally{event.target.value='';}
}
load();

</script></body></html>
